<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#14141e" />
      <stop offset="100%" stop-color="#0d0e15" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <rect width="1280" height="720" fill="url(#grid)" />

  <!-- Ambient Glow Behind Play Button -->
  <circle cx="640" cy="360" r="280" fill="url(#glowGrad)" />

  <!-- Decorative Tech elements / code brackets -->
  <g opacity="0.2" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Code bracket left -->
    <path d="M 280 280 L 220 360 L 280 440" />
    <!-- Code bracket right -->
    <path d="M 1000 280 L 1060 360 L 1000 440" />
  </g>

  <!-- Subtle corner tech markers -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none">
    <path d="M 60 90 L 60 60 L 90 60" />
    <path d="M 1220 90 L 1220 60 L 1190 60" />
    <path d="M 60 630 L 60 660 L 90 660" />
    <path d="M 1220 630 L 1220 660 L 1190 660" />
  </g>

  <!-- Central YouTube Card -->
  <g filter="url(#shadow)">
    <!-- Main red icon pill -->
    <rect x="520" y="275" width="240" height="170" rx="42" fill="url(#redGrad)" />
    <!-- Play Triangle -->
    <polygon points="625,325 625,395 690,360" fill="#ffffff" />
  </g>

  <!-- Channel Badge / Subtitle -->
  <text x="640" y="505" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#ffffff" opacity="0.9">YOUTUBE CHANNEL</text>
  <text x="640" y="538" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="2" fill="rgba(255,255,255,0.45)">DEVLOGS • TUTORIALS • TECH</text>
</svg>
